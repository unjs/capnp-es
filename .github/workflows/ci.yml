name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "pnpm"
      - uses: ./.github/actions/install-capnp
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm vitest --coverage
      - run: pnpm test:types
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  typescript:
    name: typescript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript:
          # Lowest version allowed by peerDependencies.
          - "5.7.3"
          - "5.9.3"
          - "6.0.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "pnpm"
      - uses: ./.github/actions/install-capnp
      - run: pnpm install
      - run: pnpm add -D typescript@${{ matrix.typescript }}
      - run: pnpm build
      - run: pnpm test
